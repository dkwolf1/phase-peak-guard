title: Phase Guard
path: phase-guard-en
icon: mdi:chart-timeline-variant
type: sections
subview: true
max_columns: 3
dense_section_placement: false
theme: Frosted Glass Dark
header:
  layout: responsive
  badges_position: bottom
  badges_wrap: scroll
badges:
  - type: entity
    entity: sensor.phase_guard_status
    name: Status
    icon: mdi:shield-home
    show_state: true
    show_icon: true
    show_name: true
    color: state
  - type: entity
    entity: sensor.phase_guard_peak_phase_current
    name: Peak phase
    icon: mdi:current-ac
    show_state: true
    show_icon: true
    show_name: true
    color: state
  - type: entity
    entity: sensor.phase_guard_lowest_headroom
    name: Lowest headroom
    icon: mdi:gauge-low
    show_state: true
    show_icon: true
    show_name: true
    color: state
  - type: entity
    entity: binary_sensor.phase_guard_data_valid
    name: Source data
    icon: mdi:database-check
    show_state: true
    show_icon: true
    show_name: true
    color: state

sections:
  # Row 1: status, capacity and distribution in three equal-width sections.
  - type: grid
    title: Status
    cards:
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.phase_guard_data_valid
            state: "off"
        card:
          type: tile
          entity: binary_sensor.phase_guard_data_valid
          name: Measurement data unreliable
          icon: mdi:database-alert
          color: red
          vertical: false
        grid_options:
          columns: full
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.phase_guard_overload
            state: "on"
        card:
          type: tile
          entity: binary_sensor.phase_guard_overload
          name: Overload detected
          icon: mdi:flash-alert
          color: red
          vertical: false
        grid_options:
          columns: full
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.phase_guard_critical
            state: "on"
          - condition: state
            entity: binary_sensor.phase_guard_overload
            state: "off"
        card:
          type: tile
          entity: binary_sensor.phase_guard_critical
          name: Critical phase load
          icon: mdi:alert-octagon
          color: red
          vertical: false
        grid_options:
          columns: full
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.phase_guard_status
            name: Current status
            icon: mdi:shield-home
          - entity: sensor.phase_guard_reason
            name: Explanation
            icon: mdi:text-box-outline
          - entity: sensor.phase_guard_recommended_action
            name: Recommended action
            icon: mdi:lightbulb-alert
          - entity: sensor.phase_guard_last_update
            name: Last update
            icon: mdi:clock-check
        grid_options:
          columns: full

  - type: grid
    title: Capacity
    cards:
      - type: gauge
        entity: sensor.phase_guard_peak_phase_current
        name: Peak phase current
        min: 0
        max: 30
        needle: true
        severity:
          green: 0
          yellow: 17.5
          red: 22.5
        grid_options:
          columns: full
          rows: 3
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.phase_guard_most_loaded_phase
            name: Most loaded phase
            icon: mdi:arrow-up-bold-circle
          - entity: sensor.phase_guard_lowest_headroom
            name: Lowest remaining headroom
            icon: mdi:gauge-low
          - entity: sensor.phase_guard_total_current
            name: Sum of phase currents
            icon: mdi:sigma
        grid_options:
          columns: full

  - type: grid
    title: Distribution
    cards:
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.phase_guard_most_loaded_phase
            name: Most loaded
            icon: mdi:arrow-up-bold-circle
          - entity: sensor.phase_guard_least_loaded_phase
            name: Least loaded
            icon: mdi:arrow-down-bold-circle
          - entity: sensor.phase_guard_phase_imbalance_amp
            name: Phase difference
            icon: mdi:scale-unbalanced
          - entity: sensor.phase_guard_phase_imbalance_percent
            name: Imbalance
            icon: mdi:percent
          - entity: sensor.phase_guard_current_source
            name: Current source
            icon: mdi:source-branch
          - entity: binary_sensor.phase_guard_data_valid
            name: Measurement data valid
            icon: mdi:database-check
        grid_options:
          columns: full

  # Row 2: all three phases use the same card layout.
  - type: grid
    title: Phase L1
    cards:
      - type: gauge
        entity: sensor.phase_guard_l1_current
        name: L1 current
        min: 0
        max: 30
        needle: true
        severity:
          green: 0
          yellow: 17.5
          red: 22.5
        grid_options:
          columns: full
          rows: 3
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.phase_guard_l1_level
            name: Load level
            icon: mdi:gauge
          - entity: sensor.phase_guard_l1_headroom
            name: Headroom
            icon: mdi:gauge-low
          - entity: sensor.phase_guard_l1_predicted_60s
            name: Predicted in 60 seconds
            icon: mdi:chart-timeline-variant-shimmer
          - entity: sensor.phase_guard_l1_fuse_stress
            name: Heuristic fuse stress
            icon: mdi:thermometer-alert
          - entity: sensor.phase_guard_l1_direction
            name: Energy direction
            icon: mdi:swap-horizontal
        grid_options:
          columns: full

  - type: grid
    title: Phase L2
    cards:
      - type: gauge
        entity: sensor.phase_guard_l2_current
        name: L2 current
        min: 0
        max: 30
        needle: true
        severity:
          green: 0
          yellow: 17.5
          red: 22.5
        grid_options:
          columns: full
          rows: 3
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.phase_guard_l2_level
            name: Load level
            icon: mdi:gauge
          - entity: sensor.phase_guard_l2_headroom
            name: Headroom
            icon: mdi:gauge-low
          - entity: sensor.phase_guard_l2_predicted_60s
            name: Predicted in 60 seconds
            icon: mdi:chart-timeline-variant-shimmer
          - entity: sensor.phase_guard_l2_fuse_stress
            name: Heuristic fuse stress
            icon: mdi:thermometer-alert
          - entity: sensor.phase_guard_l2_direction
            name: Energy direction
            icon: mdi:swap-horizontal
        grid_options:
          columns: full

  - type: grid
    title: Phase L3
    cards:
      - type: gauge
        entity: sensor.phase_guard_l3_current
        name: L3 current
        min: 0
        max: 30
        needle: true
        severity:
          green: 0
          yellow: 17.5
          red: 22.5
        grid_options:
          columns: full
          rows: 3
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.phase_guard_l3_level
            name: Load level
            icon: mdi:gauge
          - entity: sensor.phase_guard_l3_headroom
            name: Headroom
            icon: mdi:gauge-low
          - entity: sensor.phase_guard_l3_predicted_60s
            name: Predicted in 60 seconds
            icon: mdi:chart-timeline-variant-shimmer
          - entity: sensor.phase_guard_l3_fuse_stress
            name: Heuristic fuse stress
            icon: mdi:thermometer-alert
          - entity: sensor.phase_guard_l3_direction
            name: Energy direction
            icon: mdi:swap-horizontal
        grid_options:
          columns: full

  # Row 3: two charts and the structural assessment.
  - type: grid
    title: Phase current — 24 hours
    cards:
      - type: history-graph
        hours_to_show: 24
        entities:
          - entity: sensor.phase_guard_l1_current
            name: L1
          - entity: sensor.phase_guard_l2_current
            name: L2
          - entity: sensor.phase_guard_l3_current
            name: L3
        grid_options:
          columns: full
          rows: 4

  - type: grid
    title: Fuse stress — 24 hours
    cards:
      - type: history-graph
        hours_to_show: 24
        entities:
          - entity: sensor.phase_guard_l1_fuse_stress
            name: L1
          - entity: sensor.phase_guard_l2_fuse_stress
            name: L2
          - entity: sensor.phase_guard_l3_fuse_stress
            name: L3
        grid_options:
          columns: full
          rows: 4

  - type: grid
    title: Structural balance
    cards:
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.phase_guard_structural_imbalance
            name: Assessment
            icon: mdi:scale-balance
          - entity: sensor.phase_guard_structural_imbalance_amp
            name: Difference
            icon: mdi:scale-unbalanced
          - entity: sensor.phase_guard_historically_most_loaded_phase
            name: Historically most loaded phase
            icon: mdi:arrow-up-bold-circle
          - entity: sensor.phase_guard_historically_least_loaded_phase
            name: Historically least loaded phase
            icon: mdi:arrow-down-bold-circle
        grid_options:
          columns: full

  # Row 4: identical long-term values per phase.
  - type: grid
    title: History L1
    cards:
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.phase_guard_l1_p95_7d
            name: P95 — 7 days
            icon: mdi:chart-bell-curve
          - entity: sensor.phase_guard_l1_p95_30d
            name: P95 — 30 days
            icon: mdi:chart-bell-curve-cumulative
          - entity: sensor.phase_guard_l1_mean_7d
            name: Average — 7 days
            icon: mdi:chart-line
          - entity: sensor.phase_guard_l1_max_30d
            name: Maximum — 30 days
            icon: mdi:chart-line-variant
        grid_options:
          columns: full

  - type: grid
    title: History L2
    cards:
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.phase_guard_l2_p95_7d
            name: P95 — 7 days
            icon: mdi:chart-bell-curve
          - entity: sensor.phase_guard_l2_p95_30d
            name: P95 — 30 days
            icon: mdi:chart-bell-curve-cumulative
          - entity: sensor.phase_guard_l2_mean_7d
            name: Average — 7 days
            icon: mdi:chart-line
          - entity: sensor.phase_guard_l2_max_30d
            name: Maximum — 30 days
            icon: mdi:chart-line-variant
        grid_options:
          columns: full

  - type: grid
    title: History L3
    cards:
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.phase_guard_l3_p95_7d
            name: P95 — 7 days
            icon: mdi:chart-bell-curve
          - entity: sensor.phase_guard_l3_p95_30d
            name: P95 — 30 days
            icon: mdi:chart-bell-curve-cumulative
          - entity: sensor.phase_guard_l3_mean_7d
            name: Average — 7 days
            icon: mdi:chart-line
          - entity: sensor.phase_guard_l3_max_30d
            name: Maximum — 30 days
            icon: mdi:chart-line-variant
        grid_options:
          columns: full

  # Row 5: threshold duration per phase, again using the same layout.
  - type: grid
    title: Threshold duration L1
    cards:
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.phase_guard_l1_high_duration
            name: Above 20 A
            icon: mdi:timer-alert
          - entity: sensor.phase_guard_l1_critical_duration
            name: Above 22.5 A
            icon: mdi:timer-alert-outline
          - entity: sensor.phase_guard_l1_limit_duration
            name: Above 25 A
            icon: mdi:flash-alert
        grid_options:
          columns: full

  - type: grid
    title: Threshold duration L2
    cards:
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.phase_guard_l2_high_duration
            name: Above 20 A
            icon: mdi:timer-alert
          - entity: sensor.phase_guard_l2_critical_duration
            name: Above 22.5 A
            icon: mdi:timer-alert-outline
          - entity: sensor.phase_guard_l2_limit_duration
            name: Above 25 A
            icon: mdi:flash-alert
        grid_options:
          columns: full

  - type: grid
    title: Threshold duration L3
    cards:
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.phase_guard_l3_high_duration
            name: Above 20 A
            icon: mdi:timer-alert
          - entity: sensor.phase_guard_l3_critical_duration
            name: Above 22.5 A
            icon: mdi:timer-alert-outline
          - entity: sensor.phase_guard_l3_limit_duration
            name: Above 25 A
            icon: mdi:flash-alert
        grid_options:
          columns: full

cards: []
background:
  opacity: 53
  alignment: center
  size: cover
  repeat: no-repeat
  attachment: fixed
  image: /local/achtergrond.jpg
